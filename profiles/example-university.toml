# Пример профиля кафедры. Копируется, переименовывается и правится под свои
# требования; запускается как `nk check ... --profile путь/к/файлу.toml`.
#
# Профиль может отключать правила, менять их уровень и задавать параметры.
# Наследование — на один уровень: профиль, от которого наследуются, сам
# наследоваться не может.

name = "Кафедра N"
extends = "base"

# Отключить правила целиком.
disable = [
  # На кафедре принято сокращение «рис.» в ссылках на иллюстрации.
  "figure-reference-word",
  # Библиография собирается BibTeX, порядок записей проверяется вручную.
  "bibtex-order-unverifiable",
]

# Включить правило, выключенное по умолчанию.
enable = ["preposition-nbsp"]

# Понизить уровень: нарушение показывается, но не влияет на код возврата.
[rules."heading-depth"]
severity = "info"

[rules."formula-no-reference"]
severity = "info"

# Поднять уровень.
[rules."table-reference-word"]
severity = "error"

# Переопределить параметры правила. Незаданные параметры берутся из объявления.
[rules."keywords-count".params]
keywords_max = 20

# Убрать элемент из обязательных, оставив остальные. Полный перечень задаётся
# ключом required.
[rules."required-element-missing".params]
excluded = ["РЕФЕРАТ"]

# Наименования, принятые кафедрой вместо стандартных: слева — как пишет кафедра,
# справа — наименование по стандарту.
[elements.aliases]
"СПИСОК ЛИТЕРАТУРЫ" = "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ"
