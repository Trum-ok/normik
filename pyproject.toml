[project]
name = "normik"
version = "0.1.0"
description = "Проверка работ на соответствие ГОСТ"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13.4"
dependencies = [
    "typer>=0.20.0",
    "rich>=14.0.0",
]

[project.scripts]
nk = "nk.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/nk"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]
docs = [
    # ProperDocs — продолжение MkDocs 1.x: MkDocs 2 несовместим с темой и плагинами.
    "properdocs>=1.6.7",
    "mkdocs-material>=9.7.0",
    "mkdocs-literate-nav>=0.6.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "RUF",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "RUF001", # кириллица в строках
    "RUF002", # кириллица в докстрингах
    "RUF003", # кириллица в комментариях
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.13"
root = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]
