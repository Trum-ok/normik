[project]
name = "normik"
dynamic = ["version"]
description = "Проверка работ на соответствие ГОСТ"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "Arkadii Artamonov", email = "artamarkan@gmail.com" }]
keywords = ["latex", "linter", "gost", "нир", "гост"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "Natural Language :: Russian",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Markup :: LaTeX",
    "Typing :: Typed",
]
dependencies = [
    "typer>=0.20.0",
    "rich>=14.0.0",
]

[project.urls]
Homepage = "https://trum-ok.github.io/normik/"
Documentation = "https://trum-ok.github.io/normik/"
Repository = "https://github.com/Trum-ok/normik"
Issues = "https://github.com/Trum-ok/normik/issues"

[project.scripts]
nk = "nk.cli:app"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/nk/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/nk"]

[tool.hatch.build.targets.sdist]
exclude = [".cache", ".github", ".idea", "site", "local"]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.16.5",
    "ty>=0.0.78",
]
docs = [
    # ProperDocs — продолжение MkDocs 1.x: MkDocs 2 несовместим с темой и плагинами.
    "properdocs>=1.6.7",
    "mkdocs-material>=9.7.0",
    "mkdocs-literate-nav>=0.6.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",
    "W",
    "F",
    "I",
    "B",
    "C4",
    "UP",
    "N",
    "RUF",
    "SIM",
]
ignore = [
    "E501",
    "B008",
    "RUF001", # кириллица в строках
    "RUF002", # кириллица в докстрингах
    "RUF003", # кириллица в комментариях
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false

[tool.ty.environment]
python-version = "3.11"
root = ["src", "tests"]

[tool.ty.src]
include = ["src", "tests"]
