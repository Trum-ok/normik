site_name: normik
site_description: Линтер оформления отчёта о НИР по ГОСТ 7.32-2017 для исходников LaTeX
site_url: https://trum-ok.github.io/normik/
repo_url: https://github.com/Trum-ok/normik
repo_name: Trum-ok/normik
edit_uri: edit/master/docs/
copyright: normik — свободное программное обеспечение

docs_dir: docs
site_dir: site

theme:
  name: material
  language: ru
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Тёмная тема
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Светлая тема

# Версии пакета и схемы JSON в тексте документации подставляются из кода.
hooks:
  - hooks/versions.py

plugins:
  - search:
      lang: ru
  - literate-nav

nav:
  - Обзор: index.md
  - Начало работы:
      - Установка: installation.md
      - Использование: usage.md
      - Профили: profiles.md
      - Интеграции: integrations.md
  - Правила: rules/
  - Разработка:
      - Как добавить правило: contributing.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      # Кириллица в заголовках: без юникодного слага якоря выходят пустыми.
      slugify: !!python/object/apply:pymdownx.slugs.slugify {kwds: {case: lower}}
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/Trum-ok/normik
