# Чистый ГОСТ Р 2.105-2019: текстовый документ ЕСКД — пояснительная записка,
# расчёт, техническое задание.
#
#   nk check chapters --profile gost-r-2.105
#
# Правила, которых в этом стандарте нет, отбираются сами: требование реферата,
# ключевых слов и регистра заголовков структурных элементов записано только
# в ГОСТ 7.32-2017, и под этим профилем такие правила не запускаются.

name = "ГОСТ Р 2.105-2019"
extends = "base"
standard = "GR2105"

# Раздел с нового листа стандарт рекомендует, а не требует (п. 6.6.5), поэтому
# находка не роняет сборку.
[rules."section-page-break"]
severity = "warning"

# Маркированный список оформляют дефисами (п. 6.7.4), а не тире, как в ГОСТ 7.32.
# Буквенный список ведут русскими либо латинскими буквами (п. 6.7.5).
[rules."enumeration-label".params]
marker = "-"
alphabets = ["cyrillic", "latin"]

# Латинские I и O исключены наравне с русскими буквами (п. 6.7.5 через п. 6.3.5).
[rules."enumeration-letters".params]
forbidden = "ёзйочъыьio"

# Обязательны только титульный лист и основное тематическое содержание (п. 6.1.2),
# а заголовка структурного элемента у них нет: по исходникам не обнаруживаются.
# Остальные элементы приводят при необходимости.
[rules."required-element-missing".params]
required = []

# Состав и порядок структурных элементов по п. 6.1.1. Приложения идут до
# ссылочных документов и библиографии — не так, как в ГОСТ 7.32.
[elements.order]
"ПРЕДИСЛОВИЕ" = 1
"СОДЕРЖАНИЕ" = 2
"ОБОЗНАЧЕНИЯ И СОКРАЩЕНИЯ" = 3
"ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ" = 4
"ПРИЛОЖЕНИЕ" = 5
"ССЫЛОЧНЫЕ НОРМАТИВНЫЕ ДОКУМЕНТЫ" = 6
"ССЫЛОЧНЫЕ ДОКУМЕНТЫ" = 7
"БИБЛИОГРАФИЯ" = 8
"ЛИСТ РЕГИСТРАЦИИ ИЗМЕНЕНИЙ" = 9

# Перечень обозначений идёт перед терминами (п. 6.15.2) — обратно порядку
# ГОСТ 7.32. Реферата у текстового документа нет, поэтому роль реферата пустует
# и правила о нём молчат.
[elements.roles]
contents = ["СОДЕРЖАНИЕ"]
terms = ["ТЕРМИНЫ И ОПРЕДЕЛЕНИЯ"]
abbreviations = ["ОБОЗНАЧЕНИЯ И СОКРАЩЕНИЯ"]
bibliography = ["БИБЛИОГРАФИЯ"]
appendix = ["ПРИЛОЖЕНИЕ"]

# Стандарт допускает объединение перечней обозначений и терминов (п. 6.15.2).
[elements.aliases]
"ОБОЗНАЧЕНИЯ СОКРАЩЕНИЯ И ТЕРМИНЫ" = "ОБОЗНАЧЕНИЯ И СОКРАЩЕНИЯ"
