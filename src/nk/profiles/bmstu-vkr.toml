# ВКР по положению МГТУ им. Н.Э. Баумана № 01-01-ПЛ-016 01-2024.
#
# Положение ссылается и на ГОСТ 7.32-2017, и на ГОСТ Р 2.105-2019, а часть
# требований задаёт само. Профиль настраивает правила 7.32 под то, что написано
# в положении.
#
#   nk check chapters --profile bmstu-vkr

name = "МГТУ, ВКР"
extends = "base"
standard = "G732"

# Ключевых слов положение не требует: реферат (аннотация) отражает объект,
# цель, методы, результаты и область применения — перечня ключевых слов в
# составе нет (п. 9.3).
disable = [
  "keywords-count",
  "keywords-final-dot",
  "keywords-uppercase",
  # Порядок источников — алфавитный либо по появлению ссылок, на выбор автора
  # (п. 10.10). Выбор из двух порядков по исходникам не проверяется.
  "bibliography-order",
  # Установленной вводной фразы перечни не имеют: положение описывает только
  # столбец с расшифровками справа через тире (п. 10.9).
  "terms-opening",
  "abbreviations-opening",
]

# Требование, которого в ГОСТ 7.32 нет, а положение его предъявляет: формулы,
# следующие одна за другой и не разделённые текстом, разделяют запятой (п. 10.7).
# В реестре это правило числится за ГОСТ Р 2.105, поэтому включается явно.
enable = ["formula-sequence-comma"]

# Там, где положение расходится со стандартом, находка обязана ссылаться на
# положение: пункт 7.32 в этом месте требует другого, и отсылка к нему сбивала
# бы с толку. Пункт задаётся правилу ключом clause, название источника — здесь.
[source]
title = "Положение МГТУ им. Н.Э. Баумана № 01-01-ПЛ-016 01-2024"

# Обозначения приложений — арабские цифры (п. 10.11), тогда как ГОСТ 7.32
# в п. 6.17.4 требует кириллицы.
#
# Положение в этом месте противоречит себе: в тексте сказано «арабскими цифрами
# или латинскими буквами», а пример тут же приводит «Приложение 1» или
# «Приложение А» с кириллической А. Набор здесь один, потому что задаётся
# строкой; если на кафедре принята другая система, замените строку на
# "ABCDEFGHJKLMNPQRSTUVWXYZ" либо на "АБВГДЕЖИКЛМНПРСТУФХЦШЩЭЮЯ".
[appendix]
letters = "123456789"

[rules."appendix-letter"]
clause = "10.11"

[rules."appendix-sequence"]
clause = "10.11"

[rules."formula-sequence-comma"]
clause = "10.7"

# Разделы основной части с новой страницы положение не требует: это сказано
# только про структурные элементы.
[rules."section-page-break"]
clause = "9.3"

[rules."section-page-break".params]
structural_only = true

# Реферат и перечень обозначений положение оставляет на усмотрение кафедры
# (п. 9.3), поэтому обязательными они не считаются.
[rules."required-element-missing".params]
required = [
  "СОДЕРЖАНИЕ",
  "ВВЕДЕНИЕ",
  "ЗАКЛЮЧЕНИЕ",
  "СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ",
]

# Состав и порядок структурных элементов РПЗ (п. 9.3). Титульный лист, задание
# и календарный план заголовка структурного элемента не имеют и по исходникам
# не обнаруживаются, поэтому в состав не входят.
[elements.order]
"РЕФЕРАТ" = 1
"СОДЕРЖАНИЕ" = 2
"СПИСОК ОБОЗНАЧЕНИЙ И СОКРАЩЕНИЙ" = 3
"ВВЕДЕНИЕ" = 4
"ЗАКЛЮЧЕНИЕ" = 5
"СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ" = 6
"ПРИЛОЖЕНИЕ" = 7

# Перечень у положения один на термины и сокращения (п. 10.9). Роль ему дана
# одна: под обеими правила о терминах и о сокращениях проверяли бы один и тот же
# столбец и выдавали каждую находку дважды. Роль терминов пустует, и правила
# о перечне терминов молчат.
[elements.roles]
abstract = ["РЕФЕРАТ"]
contents = ["СОДЕРЖАНИЕ"]
abbreviations = ["СПИСОК ОБОЗНАЧЕНИЙ И СОКРАЩЕНИЙ"]
bibliography = ["СПИСОК ИСПОЛЬЗОВАННЫХ ИСТОЧНИКОВ"]
appendix = ["ПРИЛОЖЕНИЕ"]

[elements.aliases]
"АННОТАЦИЯ" = "РЕФЕРАТ"
