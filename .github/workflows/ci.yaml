name: ci

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: ruff format
        run: uv run ruff format --check src tests

      - name: ruff check
        run: uv run ruff check src tests

      - name: ty
        run: uv run ty check src tests

  # Нижняя граница requires-python и всё, что выше: линтер обещает работать
  # на каждой из этих версий, значит на каждой и проверяется.
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    env:
      UV_PYTHON: ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup

      - name: pytest
        run: uv run pytest

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
        with:
          groups: docs

      - name: Страницы правил не разошлись с реестром
        run: |
          uv run nk rules docs
          # --porcelain, а не diff: новая страница правила приходит как untracked.
          changed=$(git status --porcelain -- docs/rules)
          if [ -n "$changed" ]; then
            echo "$changed"
            echo "docs/rules устарел — перегенерируйте: uv run nk rules docs"
            exit 1
          fi

      - name: properdocs build
        run: uv run --group docs properdocs build --strict

  # Единственный required-чек ветки: агрегирует остальные job'ы, чтобы при
  # добавлении новой проверки не править список в настройках репозитория.
  ci:
    if: always()
    needs:
      - lint
      - test
      - docs
    runs-on: ubuntu-latest
    steps:
      - name: Итог
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          jq -r 'to_entries[] | "\(.value.result)\t\(.key)"' <<< "$RESULTS"
          failed=$(jq -r 'to_entries[]
            | select(.value.result != "success" and .value.result != "skipped")
            | .key' <<< "$RESULTS")
          if [ -n "$failed" ]; then
            echo "Провалились: $(echo "$failed" | tr '\n' ' ')"
            exit 1
          fi
