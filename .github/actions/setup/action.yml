name: setup
description: uv и синхронизация зависимостей

inputs:
  groups:
    description: Дополнительные группы зависимостей, через пробел
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v10.0.1
      with:
        enable-cache: true

    - name: Sync deps
      shell: bash
      env:
        GROUPS: ${{ inputs.groups }}
      run: |
        extra=""
        for group in $GROUPS; do
          extra="$extra --group $group"
        done
        uv sync --frozen $extra
